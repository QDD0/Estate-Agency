<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/people/main.css}">
</head>
<body>
<style>
    :root {
        --menu-bg: linear-gradient(135deg, rgba(10, 30, 60, 0.85), rgba(5, 15, 35, 0.85));
        --hover-bg: rgba(0, 180, 255, 0.15);
        --accent: #00b4ff;
        --text-color: #ffffff;
        --transition: 0.35s ease;
    }

    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .nav-container {
        display: flex;
        justify-content: center;
        width: 100%;
    }

    .glass-menu {
        display: flex;
        gap: 12px;
        padding: 12px 18px;
        border-radius: 60px;
        background: var(--menu-bg);
        backdrop-filter: blur(14px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        list-style: none;
    }

    .glass-menu a {
        position: relative;
        padding: 12px 20px;
        border-radius: 30px;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-color);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: var(--transition);
        cursor: pointer;
    }

    .glass-menu a:hover {
        background: var(--hover-bg);
        color: var(--accent);
        box-shadow: 0 0 15px rgba(0, 180, 255, 0.6);
        transform: translateY(-3px);
    }

    .glass-menu a:hover::after {
        width: 60%;
    }

    .glass-menu i {
        font-size: 0.9rem;
        transition: var(--transition);
    }

    .glass-menu a:hover i {
        transform: scale(1.15);
    }
</style>
<header>
    <nav class="navbar">
        <div class="nav-container">
            <ul class="menu-bar glass-menu">
                <li><a th:href="@{/people}"><i ></i>Покупатели</a></li>
                <li><a th:href="@{/agency}"><i ></i>Агентство</a></li>
                <li><a th:href="@{/realtor}"><i ></i>Риелторы</a></li>
                <li><a th:href="@{/properties}"><i ></i>Недвижимость</a></li>
                <li><a th:href="@{/history}"><i ></i>История продаж</a></li>
            </ul>
        </div>
    </nav>
</header>
</body>
</html>
