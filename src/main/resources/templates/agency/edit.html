<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${agency.name}"></title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/agency/agency.css}">
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1 class="page-title">
            <i class="fas fa-edit"></i>
            Редактирование агентства
        </h1>
        <p class="page-subtitle">Измените необходимые поля для обновления информации об агентстве</p>
    </div>

    <div class="form-container">
        <form method="post" th:action="@{/agency/{id}(id=${agency.id_agency})}" th:object="${agency}">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label required">
                        <i class="fas fa-building"></i> Название агентства
                    </label>
                    <input type="text" th:field="*{name}" class="form-input">
                    <div class="error-message" th:if="${#fields.hasErrors('name')}">
                        <i class="fas fa-exclamation-circle"></i>
                        <span th:errors="*{name}"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label required">
                        <i class="fas fa-phone"></i> Телефон
                    </label>
                    <input type="text" th:field="*{phone}" class="form-input">
                    <div class="error-message" th:if="${#fields.hasErrors('phone')}">
                        <i class="fas fa-exclamation-circle"></i>
                        <span th:errors="*{phone}"></span>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label required">
                        <i class="fas fa-globe"></i> Страна
                    </label>
                    <input type="text" th:field="*{country}" class="form-input">
                    <div class="error-message" th:if="${#fields.hasErrors('country')}">
                        <i class="fas fa-exclamation-circle"></i>
                        <span th:errors="*{country}"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label required">
                        <i class="fas fa-city"></i> Город
                    </label>
                    <input type="text" th:field="*{city}" class="form-input">
                    <div class="error-message" th:if="${#fields.hasErrors('city')}">
                        <i class="fas fa-exclamation-circle"></i>
                        <span th:errors="*{city}"></span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label required">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="text" th:field="*{email}" class="form-input">
                <div class="error-message" th:if="${#fields.hasErrors('email')}">
                    <i class="fas fa-exclamation-circle"></i>
                    <span th:errors="*{email}"></span>
                </div>
            </div>

            <div class="owner-section">
                <h3 class="owner-title">
                    <i class="fas fa-user-tie"></i> Изменить владельца агентства
                </h3>
                <div class="form-group">
                    <select th:field="*{owner.id_person}" class="form-select">
                        <option value="">Выберите владельца из списка</option>
                        <option th:each="person : ${people}"
                                th:value="${person.id_person}"
                                th:text="${person.firstname + ' ' + person.surname + ' ' + person.lastname}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-submit">
                    <i class="fas fa-save"></i> Сохранить изменения
                </button>

                <a th:href="@{/agency}" class="btn btn-back">
                    <i class="fas fa-times"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
