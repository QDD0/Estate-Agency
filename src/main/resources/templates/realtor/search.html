<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Результаты поиска риелторов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/realtor/realtor.css}">
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1 class="page-title">
            <i class="fas fa-search"></i> Результаты поиска риелторов
        </h1>
    </div>

    <div class="search-header">
        <div class="search-info">
            <i class="fas fa-info-circle"></i>
            <span>Найдено риелторов:
                <span class="result-count" th:text="${realtors.size()}"></span>
            </span>
        </div>

        <a th:href="@{/realtor(page=${currentPage ?: 1})}" class="btn btn-back">
            <i class="fas fa-arrow-left"></i> Назад к списку
        </a>
    </div>

    <div th:if="${realtors.isEmpty()}" class="no-results">
        <i class="fas fa-search"></i>
        <h3>Риелторы не найдены</h3>
        <p>Попробуйте изменить параметры поиска</p>
    </div>

    <div class="realtors-grid" th:unless="${realtors.isEmpty()}">
        <div th:each="realtor : ${realtors}" class="realtor-card">
            <div class="realtor-id">
                <i class="fas fa-hashtag"></i>
                ID: <span th:text="${realtor.id_realtor}"></span>
            </div>

            <div class="realtor-name">
                <i class="fas fa-user-tie"></i>
                <span th:text="${realtor.person.lastname + ' ' + realtor.person.firstname + ' ' + realtor.person.surname}"></span>
            </div>

            <div class="realtor-info">
                <div class="info-section person-section">
                    <div class="section-title">
                        <i class="fas fa-user"></i> Персональные данные
                    </div>
                    <div class="info-item">
                        <span class="info-label">Телефон:</span>
                        <span class="badge contact-badge" th:text="${realtor.person.phone}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Дата рождения:</span>
                        <span class="badge" th:text="${#temporals.format(realtor.person.birthdate, 'dd.MM.yyyy')}"></span>
                    </div>
                </div>

                <div class="info-section agency-section" th:if="${realtor.agency != null}">
                    <div class="section-title">
                        <i class="fas fa-building"></i> Агентство
                    </div>
                    <div class="info-item">
                        <span class="info-label">Название:</span>
                        <span class="badge" th:text="${realtor.agency.name}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Местоположение:</span>
                        <span class="badge location-badge"
                              th:text="${realtor.agency.country + ', ' + realtor.agency.city}"></span>
                    </div>
                </div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a th:href="@{/realtor/{id}(id=${realtor.id_realtor})}" class="btn btn-secondary">
                    <i class="fas fa-eye"></i> Подробнее
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
