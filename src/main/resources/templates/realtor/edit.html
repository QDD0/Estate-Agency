<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${realtors.person.surname + ' ' + realtors.person.firstname}">Редактирование риелтора</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/realtor/realtor.css}">
</head>
<body>
<div class="container">
    <div class="form-container">
        <div class="form-header">
            <h1 class="form-title">
                <i class="fas fa-user-edit"></i> Редактирование риелтора
            </h1>
            <p class="form-subtitle" th:text="${realtors.person.lastname + ' ' + realtors.person.firstname + ' ' + realtors.person.surname}"></p>
        </div>

        <form method="post" th:action="@{/realtor/{id}(id=${realtors.id_realtor})}" th:object="${realtors}">
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-user"></i> Имя
                </label>
                <input type="text" th:field="*{person.firstname}" class="form-control" placeholder="Введите имя">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-user"></i> Фамилия
                </label>
                <input type="text" th:field="*{person.surname}" class="form-control" placeholder="Введите фамилию">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-user"></i> Отчество
                </label>
                <input type="text" th:field="*{person.lastname}" class="form-control" placeholder="Введите отчество">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-birthday-cake"></i> Дата рождения
                </label>
                <input type="date" th:field="*{person.birthdate}" class="form-control">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-passport"></i> Серия паспорта
                </label>
                <input type="number" th:field="*{person.passportseries}" class="form-control" placeholder="Введите серию паспорта">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-passport"></i> Номер паспорта
                </label>
                <input type="number" th:field="*{person.passportnumber}" class="form-control" placeholder="Введите номер паспорта">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-phone"></i> Телефон
                </label>
                <input type="text" th:field="*{person.phone}" class="form-control" placeholder="Введите телефон">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-globe"></i> Страна
                </label>
                <input type="text" th:field="*{person.country}" class="form-control" placeholder="Введите страну">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-city"></i> Город
                </label>
                <input type="text" th:field="*{person.city}" class="form-control" placeholder="Введите город">
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-building"></i> Агентство
                </label>
                <select th:field="*{agency.id_agency}" class="form-select">
                    <option value="">Выберите агентство</option>
                    <option th:each="agency : ${agencies}"
                            th:value="${agency.id_agency}"
                            th:text="${agency.name + ' (' + agency.country + ', ' + agency.city + ')'}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Сохранить изменения
                </button>

                <a th:href="@{/realtor(page=${currentPage ?: 1})}" class="btn btn-back">
                    <i class="fas fa-times"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
