<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Person Info</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            padding: 30px;
            margin-top: 20px;
        }

        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 i {
            color: #3498db;
        }

        .person-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-card {
            background: #f8fafc;
            border-left: 4px solid #3498db;
            border-radius: 8px;
            padding: 15px 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .info-card p {
            margin: 8px 0;
            display: flex;
            align-items: center;
        }

        .info-card b {
            color: #2c3e50;
            min-width: 180px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .info-card span {
            color: #555;
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #eee;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 15px;
            min-height: 48px;
            position: relative;
            overflow: hidden;
        }

        .btn-edit {
            background: linear-gradient(135deg, #4A6FA5 0%, #5C258D 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(91, 88, 181, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 13px 30px;
        }

        .btn-edit:hover {
            background: linear-gradient(135deg, #5C7BB5 0%, #6D2AA0 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(91, 88, 181, 0.4);
        }

        .btn-edit:active {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(91, 88, 181, 0.3);
        }

        .btn-delete {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 13px 30px;
        }

        .btn-delete:hover {
            background: linear-gradient(135deg, #ff6b6b 0%, #e74c3c 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(231, 76, 60, 0.35);
        }

        .btn-delete:active {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(231, 76, 60, 0.25);
        }

        .btn-back {
            background: linear-gradient(135deg, #7f8c8d 0%, #636e72 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(127, 140, 141, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 13px 30px;
        }

        .btn-back:hover {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(127, 140, 141, 0.3);
        }

        .btn-back:active {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(127, 140, 141, 0.2);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.15),
                    transparent
            );
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        form {
            display: inline;
        }

        .section-title {
            font-size: 18px;
            color: #2c3e50;
            margin: 25px 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fas fa-user-circle"></i> Информация о человеке</h2>

    <div class="person-info">
        <div class="info-card">
            <h3 class="section-title"><i class="fas fa-id-card"></i> Основная информация</h3>
            <p><b><i class="fas fa-user"></i> Имя:</b> <span th:text="${person.firstname}"></span></p>
            <p><b><i class="fas fa-user"></i> Фамилия:</b> <span th:text="${person.surname}"></span></p>
            <p><b><i class="fas fa-user"></i> Отчество:</b> <span th:text="${person.lastname}"></span></p>
            <p><b><i class="fas fa-birthday-cake"></i> Дата рождения:</b> <span th:text="${person.birthdate}"></span></p>
        </div>

        <div class="info-card">
            <h3 class="section-title"><i class="fas fa-passport"></i> Паспортные данные</h3>
            <p><b><i class="fas fa-id-card"></i> Серия паспорта:</b> <span th:text="${person.passportseries}"></span></p>
            <p><b><i class="fas fa-hashtag"></i> Номер паспорта:</b> <span th:text="${person.passportnumber}"></span></p>
        </div>

        <div class="info-card">
            <h3 class="section-title"><i class="fas fa-address-book"></i> Контактные данные</h3>
            <p><b><i class="fas fa-phone"></i> Телефон:</b> <span th:text="${person.phone}"></span></p>
            <p><b><i class="fas fa-globe"></i> Страна:</b> <span th:text="${person.country}"></span></p>
            <p><b><i class="fas fa-city"></i> Город:</b> <span th:text="${person.city}"></span></p>
        </div>
    </div>

    <div class="actions">
        <a class="btn btn-edit" th:href="@{/people/{id}/edit(id=${person.id_person})}">
            <i class="fas fa-edit"></i> Редактировать
        </a>

        <form method="post" th:action="@{/people/{id}/delete(id=${person.id_person})}">
            <button type="submit" class="btn btn-delete">
                <i class="fas fa-trash-alt"></i> Удалить
            </button>
        </form>

        <a class="btn btn-back" th:href="@{/people(page=${currentPage ?: 1})}">
            <i class="fas fa-arrow-left"></i> Назад к списку
        </a>
    </div>
</div>
</body>
</html>
