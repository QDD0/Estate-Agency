<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Недвижимость</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/property.css}">
</head>
<header>
    <nav class="navbar">
        <div class="nav-container">
            <ul class="menu-bar glass-menu">
                <li><a th:href="@{/people}"><i></i>Покупатели</a></li>
                <li><a th:href="@{/agency}"><i></i>Агентство</a></li>
                <li><a th:href="@{/realtor}"><i></i>Риелторы</a></li>
                <li><a th:href="@{/properties}"><i></i>Недвижимость</a></li>
                <li><a th:href="@{/history}"><i></i>История продаж</a></li>
            </ul>
        </div>
    </nav>
</header>
<body>
<div class="container">
    <h1 class="page-title">
        <i class="fas fa-home" style="margin-top: 7%"></i> Каталог недвижимости
    </h1>

    <div class="header-actions">
        <a th:href="@{/properties/new}" class="add-btn">
            Добавить объект
        </a>
    </div>

    <div class="properties-grid" th:unless="${#lists.isEmpty(properties)}">
        <a th:each="property : ${properties}"
           th:href="@{/properties/{id}(id=${property.id_property}, page=${currentPage})}"
           class="property-card">
            <div class="property-location">
                <div class="property-address">
                    <i class="fas fa-map-marker-alt icons"></i>
                    <span th:text="${property.city} + ', ' + ${property.country}"></span>
                </div>

                <div class="property-type">
                    <i class="fas fa-building icons"></i>
                    <span th:text="${property.typehouse}"></span>
                </div>
            </div>

            <div class="property-details">
                <div class="detail-item">
                    <div class="detail-icon">
                        <i class="fas fa-layer-group"></i>
                    </div>
                    <div class="detail-label">Этажей</div>
                    <div class="detail-value" th:text="${property.floorcount}"></div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon">
                        <i class="fas fa-door-open"></i>
                    </div>
                    <div class="detail-label">Комнат</div>
                    <div class="detail-value" th:text="${property.roomcount}"></div>
                </div>
            </div>

            <div class="owner-info" th:if="${property.owner != null}">
                <div class="owner-label">Владелец:</div>
                <div class="owner-name">
                    <i class="fas fa-user icons"></i>
                    <span th:text="${property.owner.lastname} + ' ' + ${property.owner.firstname} + ' ' + ${property.owner.surname}"></span>
                </div>
            </div>

            <div class="property-features">
                <div class="feature-badge">
                    <i class="fas fa-building icons"></i>
                    <span th:text="${property.floorcount} + ' эт.'"></span>
                </div>
                <div class="feature-badge">
                    <i class="fas fa-door-closed icons"></i>
                    <span th:text="${property.roomcount} + ' комн.'"></span>
                </div>
                <div class="feature-badge" th:if="${property.typehouse != null}">
                    <i class="fas fa-home icons"></i>
                    <span th:text="${property.typehouse}"></span>
                </div>
            </div>
        </a>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(properties)}">
        <i class="fas fa-house-circle-xmark empty-icon"></i>
        <h2 class="empty-title">Объекты недвижимости не найдены</h2>
        <p class="empty-text">Добавьте первый объект недвижимости</p>
    </div>

    <div class="pagination-container" th:unless="${#lists.isEmpty(properties)}">
        <div class="pagination">
            <a th:if="${currentPage > 0}"
               th:href="@{/properties(page=${currentPage - 1}, size=9)}"
               title="Предыдущая страница">
                <i class="fas fa-chevron-left"></i>
                ⬅ Предыдущая
            </a>

            <span>
                    <span class="page-current" th:text="${currentPage + 1}"></span> /
                    <span class="page-total" th:text="${totalPages}"></span>
                </span>

            <a th:if="${currentPage + 1 < totalPages}"
               th:href="@{/properties(page=${currentPage + 1}, size=9)}"
               title="Следующая страница">
                Следующая ➡
                <i class="fas fa-chevron-right"></i>
            </a>
        </div>
    </div>
</div>
</body>
</html>
